name: ${COMPOSE_PROJECT_NAME:-failover-drill}
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-failover-drill}-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-drill_local_password}
      MYSQL_DATABASE: drill
      MYSQL_USER: drill
      MYSQL_PASSWORD: ${DB_PASSWORD:-drill_local_password}
    ports: ["${DB_PORT:-17749}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --database=$$MYSQL_DATABASE --execute='SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-failover-drill}-redis
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-failover-drill}-backend
    environment: &env
      DATABASE_URL: mysql+pymysql://drill:${DB_PASSWORD:-drill_local_password}@db/drill
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-drill-secret-change-before-sharing-2026}
      SEED_DEMO: ${SEED_DEMO:-true}
    command: sh -c 'python -m scripts.seed_demo && uvicorn src.main:app --host 0.0.0.0 --port 8000'
    ports: ["${BACKEND_PORT:-19249}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-failover-drill}-worker
    environment: *env
    command: python -m src.worker
    volumes: ["artifacts:/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; assert time.time()-pathlib.Path('/tmp/heartbeat').stat().st_mtime<20"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-failover-drill}-frontend
    ports: ["${FRONTEND_PORT:-18249}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
